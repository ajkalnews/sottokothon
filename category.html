<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>সত্য কথন- ক্যাটাগরি পেজ</title>
    
    <link rel="icon" type="image/png" href="img/favicon.png">
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Solaimanlipi&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <!-- গ্লোবাল CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/category.css">
</head>
<body>
    <div class="mi-container">
        <!-- হেডার -->
        <div id="headerContainer"></div>

        <div class="mi-main-wrapper">
            
            <!-- মেইন কনটেন্ট এরিয়া -->
            <main class="mi-content">
                <!-- ক্যাটাগরি হেডার -->
                <div class="mi-category-header">
                    <h1 id="categoryTitle">সংবাদ লোড হচ্ছে...</h1>
                    <p id="categoryDesc">সর্বশেষ খবর এবং আপডেট</p>
                </div>

                <!-- ফিল্টার অপশন -->
                <div class="mi-filter-bar">
                    <button class="mi-filter-btn active" data-sort="latest">সর্বশেষ</button>
                    <button class="mi-filter-btn" data-sort="popular">জনপ্রিয়</button>
                    <button class="mi-filter-btn" data-sort="trending">ট্রেন্ডিং</button>
                </div>

                <!-- ডাইনামিক খবর লিস্ট কন্টেইনার -->
                <section class="mi-news-list" id="newsListContainer">
                    <p class="text-muted p-3">পোস্ট লোড করা হচ্ছে...</p>
                </section>

                <!-- পেজিনেশন -->
                <nav aria-label="ক্যাটাগরি পৃষ্ঠা" class="mi-pagination">
                    <ul class="pagination">
                        <li class="page-item"><a class="page-link" href="#">আগের</a></li>
                        <li class="page-item active"><a class="page-link" href="#">১</a></li>
                        <li class="page-item"><a class="page-link" href="#">২</a></li>
                        <li class="page-item"><a class="page-link" href="#">পরবর্তী</a></li>
                    </ul>
                </nav>
            </main>

            <!-- সাইডবার কনটেইনার -->
            <div id="sidebarContainer"></div>
            
        </div>

        <!-- ফুটার -->
        <div id="footerContainer"></div>
    </div>

    <!-- Bootstrap JS ও মূল জাভাস্ক্রিপ্টসমূহ -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
    <script src="js/header-dynamic.js"></script>
    <script src="js/sidebar-dynamic.js"></script>
    <script src="js/category-dynamic.js"></script>

    <script>
        // সব কম্পোনেন্ট ও ক্যাটাগরি পোস্ট ডাটা লোড
        async function loadCategoryPageComponents() {
            try {
                const [headerRes, sidebarRes, footerRes] = await Promise.all([
                    fetch('header.html'),
                    fetch('sidebar.html'),
                    fetch('footer.html')
                ]);

                document.getElementById('headerContainer').innerHTML = await headerRes.text();
                document.getElementById('sidebarContainer').innerHTML = await sidebarRes.text();
                document.getElementById('footerContainer').innerHTML = await footerRes.text();

                // ১. হেডার ও সাইডবার ডাইনামিক লোড
                if (typeof updateBanglaDate === 'function') updateBanglaDate();
                if (typeof loadBreakingNews === 'function') loadBreakingNews();
                if (typeof loadDynamicSidebar === 'function') loadDynamicSidebar();

                // ২. ক্যাটাগরি পেজের নির্দিষ্ট পোস্টসমূহ ডাটাবেজ থেকে লোড
                if (typeof loadCategoryPosts === 'function') loadCategoryPosts();

            } catch (error) {
                console.error('কম্পোনেন্ট লোড করতে সমস্যা হয়েছে:', error);
            }
        }

        document.addEventListener("DOMContentLoaded", loadCategoryPageComponents);
    </script>
</body>
</html>
