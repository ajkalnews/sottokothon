<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <title>অ্যাডমিন লগইন - সত্যকথন</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f3f4f6; display: flex; height: 100vh; align-items: center; justify-content: center; margin: 0; }
    .login-container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 360px; text-align: center; }
    h2 { color: #333; margin-bottom: 20px; }
    input[type="password"] { width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 16px; }
    button { width: 100%; padding: 12px; background: #0070f3; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
    button:hover { background: #0051a2; }
    .error-msg { color: red; font-size: 14px; margin-bottom: 15px; display: none; }
  </style>
</head>
<body>

  <div class="login-container">
    <h2>সত্যকথন অ্যাডমিন</h2>
    <div class="error-msg" id="errorMsg">ভুল পাসওয়ার্ড! আবার চেষ্টা করুন।</div>
    <form id="loginForm">
      <input type="password" id="password" placeholder="অ্যাডমিন পাসওয়ার্ড দিন" required>
      <button type="submit">লগইন করুন</button>
    </form>
  </div>

  <script>
    // অলরেডি লগইন করা থাকলে সরাসরি ড্যাশবোর্ডে রিডাইরেক্ট করবে
    if (localStorage.getItem('admin_token')) {
      window.location.href = '/admin/dashboard.html';
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('errorMsg');

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });

        const data = await res.json();

        if (res.ok && data.success) {
          // ব্রাউজারে টোকেন সেভ করা হচ্ছে
          localStorage.setItem('admin_token', data.token);
          window.location.href = '/admin/dashboard.html';
        } else {
          errorMsg.style.display = 'block';
          errorMsg.innerText = data.error || 'লগইন ব্যর্থ হয়েছে!';
        }
      } catch (err) {
        errorMsg.style.display = 'block';
        errorMsg.innerText = 'সার্ভার সমস্যা! পরে চেষ্টা করুন।';
      }
    });
  </script>
</body>
</html>
