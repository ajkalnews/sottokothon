<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>অ্যাডমিন লগইন - সত্যকথন</title>
  <style>
    :root {
      --primary-color: #2563eb;
      --primary-hover: #1d4ed8;
      --bg-color: #f3f4f6;
      --card-bg: #ffffff;
      --text-color: #1f2937;
      --border-color: #d1d5db;
    }

    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      height: 100vh;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }

    .login-card {
      background: var(--card-bg);
      padding: 40px 30px;
      border-radius: 12px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
      width: 100%;
      max-width: 400px;
      box-sizing: border-box;
    }

    .logo-area {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo-area h1 {
      font-size: 28px;
      margin: 0;
      color: var(--primary-color);
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .logo-area p {
      margin: 5px 0 0 0;
      font-size: 14px;
      color: #6b7280;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #4b5563;
    }

    .input-wrapper {
      position: relative;
    }

    input[type="password"] {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 16px;
      transition: all 0.2s ease;
      background-color: #f9fafb;
    }

    input[type="password"]:focus {
      outline: none;
      border-color: var(--primary-color);
      background-color: #fff;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .btn-submit {
      width: 100%;
      padding: 12px;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .btn-submit:hover {
      background-color: var(--primary-hover);
    }

    .btn-submit:disabled {
      background-color: #9ca3af;
      cursor: not-allowed;
    }

    .error-alert {
      background-color: #fee2e2;
      border: 1px solid #fecaca;
      color: #dc2626;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 20px;
      display: none;
      align-items: center;
      gap: 8px;
    }

    /* ব্যাক টু হোম লিংক */
    .back-link {
      display: block;
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: #6b7280;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .back-link:hover {
      color: var(--primary-color);
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="logo-area">
      <h1>সত্যকথন</h1>
      <p>অ্যাডমিন কন্ট্রোল প্যানেল</p>
    </div>

    <!-- এরর মেসেজ দেখানোর জায়গা -->
    <div class="error-alert" id="errorAlert">
      <strong>ভুল পাসওয়ার্ড!</strong> দয়া করে আবার চেষ্টা করুন।
    </div>

    <form id="loginForm">
      <div class="form-group">
        <label for="password">অ্যাডমিন অ্যাক্সেস পাসওয়ার্ড</label>
        <div class="input-wrapper">
          <input 
            type="password" 
            id="password" 
            placeholder="পাসওয়ার্ডটি এখানে লিখুন" 
            required 
            autocomplete="current-password"
          >
        </div>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">লগইন করুন</button>
    </form>

    <a href="/" class="back-link">← মূল ওয়েবসাইটে ফিরে যান</a>
  </div>

  <script>
    // ব্যবহারকারী যদি অলরেডি লগইন করা থাকে, তবে তাকে সরাসরি ড্যাশবোর্ডে পাঠিয়ে দেওয়া হবে
    if (localStorage.getItem('admin_token')) {
      window.location.href = '/admin/dashboard.html';
    }

    const loginForm = document.getElementById('loginForm');
    const passwordInput = document.getElementById('password');
    const errorAlert = document.getElementById('errorAlert');
    const submitBtn = document.getElementById('submitBtn');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      // ইনপুট থেকে পাসওয়ার্ড নেওয়া
      const password = passwordInput.value;
      
      // বোতাম ডিসেবল ও এরর হাইড করা
      submitBtn.disabled = true;
      submitBtn.innerText = 'যাচাই করা হচ্ছে...';
      errorAlert.style.display = 'none';

      try {
        // আমাদের API রাউটে পোস্ট রিকোয়েস্ট পাঠানো
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });

        const data = await res.json();

        if (res.ok && data.success) {
          // সফলভাবে লগইন হলে টোকেনটি ব্রাউজারের লোকাল স্টোরেজে সেভ করা হবে
          localStorage.setItem('admin_token', data.token);
          // ড্যাশবোর্ডে রিডাইরেক্ট
          window.location.href = '/admin/dashboard.html';
        } else {
          // ভুল পাসওয়ার্ড বা অন্য কোনো ত্রুটি থাকলে এরর মেসেজ দেখানো
          showError(data.error || 'ভুল পাসওয়ার্ড! আবার চেষ্টা করুন।');
        }
      } catch (err) {
        showError('সার্ভারে যোগাযোগ করতে ব্যর্থ হয়েছে। পরে আবার চেষ্টা করুন!');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = 'লগইন করুন';
      }
    });

    // এরর মেসেজ প্রদর্শনের জন্য হেল্পার ফাংশন
    function showError(message) {
      errorAlert.innerHTML = `⚠️ ${message}`;
      errorAlert.style.display = 'flex';
      passwordInput.value = ''; // পাসওয়ার্ড ফিল্ড খালি করা
      passwordInput.focus();
    }
  </script>
</body>
</html>
