<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">সত্য কথন - খবর লোড হচ্ছে...</title>
    
    <link rel="icon" type="image/png" href="img/favicon.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Solaimanlipi&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/single-post.css">
</head>
<body>
    <div class="mi-container">
        <div id="headerContainer"></div>

        <!-- মূল কনটেন্ট এবং সাইডবার র‍্যাপার -->
        <div class="mi-main-wrapper">
            
            <!-- খবর বা মেইন কনটেন্ট সেকশন -->
            <main class="mi-content">
                
                <!-- লোডার -->
                <div id="loadingSpinner" class="text-center my-5">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">লোডিং...</span>
                    </div>
                    <p class="mt-2 text-muted">সংবাদ লোড হচ্ছে...</p>
                </div>

                <!-- পোস্ট কন্টেইনার (ডিফল্টভাবে হাইড থাকবে) -->
                <article class="mi-post" id="postArticle" style="display: none;">
                    <!-- খবর হেডার -->
                    <div class="mi-post-header">
                        <span id="postCategory" class="mi-category mi-cat-politics">সাধারণ</span>
                        <h1 id="postTitle"></h1>
                        <div class="mi-post-meta">
                            <span>লেখক: <strong id="postAuthor">সত্যকথন ডেস্ক</strong></span>
                            <span>প্রকাশ: <strong id="postTime"></strong></span>
                        </div>
                    </div>

                    <!-- ফিচার ইমেজ -->
                    <div class="mi-post-image">
                        <img id="postImage" src="" alt="খবর ছবি">
                        <div id="postCaption" class="text-muted fs-6 mt-1" style="font-style: italic;"></div>
                    </div>

                    <!-- খবর কনটেন্ট -->
                    <div class="mi-post-content" id="postContent"></div>

                    <!-- শেয়ার বোতাম -->
                    <div class="mi-post-share">
                        <h5>এই খবর শেয়ার করুন:</h5>
                        <div class="mi-share-buttons">
                            <a id="shareFb" href="#" target="_blank" class="mi-share-btn mi-facebook">📘 ফেসবুক</a>
                            <a id="shareTw" href="#" target="_blank" class="mi-share-btn mi-twitter">🐦 টুইটার</a>
                            <a id="shareWa" href="#" target="_blank" class="mi-share-btn mi-whatsapp">💬 হোয়াটসঅ্যাপ</a>
                            <button onclick="copyLink()" class="mi-share-btn mi-copy">📋 কপি লিংক</button>
                        </div>
                    </div>

                    <!-- লেখক তথ্য -->
                    <div class="mi-author-info">
                        <div class="mi-author-image">👤</div>
                        <div class="mi-author-content">
                            <h5 id="authorName">সত্যকথন ডেস্ক</h5>
                            <p>সত্যকথন নিউজ পোর্টালে সর্বশেষ আপডেট এবং বস্তুনিষ্ঠ খবর পরিবেশন করা হয়।</p>
                        </div>
                    </div>

                    <!-- সংক্রান্ত খবর (সম্পর্কিত ক্যাটাগরির পোস্ট) -->
                    <div class="mi-related-posts">
                        <h3>সংক্রান্ত খবর</h3>
                        <div class="row g-3" id="relatedPostsContainer">
                            <p class="text-muted">সংক্রান্ত খবর লোড হচ্ছে...</p>
                        </div>
                    </div>

                </article>
            </main>

            <!-- সাইডবার কনটেইনার -->
            <div id="sidebarContainer"></div>

        </div>

        <div id="footerContainer"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
    <!-- সিঙ্গেল পোস্টের ডাইনামিক স্ক্রিপ্ট -->
    <script src="js/single-post-dynamic.js"></script>
<script src="js/header-dynamic.js"></script>
    <script src="js/sidebar-dynamic.js"></script>
</body>
</html>
