<body>

<div class="mi-container">

<div id="headerContainer"></div>

<div class="mi-main-wrapper">
    <!-- =========================
     Main Content
========================= -->

<main class="mi-content">

    <!-- Breadcrumb -->
    <nav aria-label="breadcrumb" class="mb-3">
        <ol class="breadcrumb">

            <li class="breadcrumb-item">
                <a href="index.html">প্রচ্ছদ</a>
            </li>

            <li class="breadcrumb-item">
                <a href="#" id="breadcrumbCategory">
                    ক্যাটাগরি
                </a>
            </li>

            <li class="breadcrumb-item active"
                aria-current="page"
                id="breadcrumbTitle">

                খবর

            </li>

        </ol>
    </nav>

    <!-- Loading -->

    <div id="loadingSpinner"
        class="text-center my-5">

        <div class="spinner-border text-danger"
            role="status">

            <span class="visually-hidden">
                Loading...
            </span>

        </div>

        <p class="mt-3">
            সংবাদ লোড হচ্ছে...
        </p>

    </div>

    <!-- =========================
         Article
    ========================= -->

    <article id="postArticle"
        class="mi-post"
        style="display:none;">

        <!-- Category -->

        <div class="mb-2">

            <span id="postCategory"
                class="badge bg-danger">

                সাধারণ

            </span>

        </div>

        <!-- Title -->

        <h1 id="postTitle"
            class="mb-3">
        </h1>

        <!-- Meta -->

        <div class="mi-post-meta mb-4">

            <span>

                <i class="fa-solid fa-user"></i>

                <strong id="postAuthor">
                    সত্য কথন ডেস্ক
                </strong>

            </span>

            &nbsp;&nbsp;

            <span>

                <i class="fa-regular fa-clock"></i>

                <strong id="postTime"></strong>

            </span>

        </div>

        <!-- Featured Image -->

        <figure class="mi-post-image">

            <img
                id="postImage"
                class="img-fluid rounded"
                loading="lazy"
                decoding="async"
                fetchpriority="high"
                src=""
                alt="">

            <figcaption
                id="postCaption"
                class="text-muted mt-2 fst-italic">

            </figcaption>

        </figure>

        <!-- Content -->

        <div id="postContent"
            class="mi-post-content mt-4">

        </div>

        <!-- =========================
             Share Buttons
        ========================= -->

        <div class="mi-post-share mt-5">

            <h5>
                এই সংবাদটি শেয়ার করুন
            </h5>

            <div class="mi-share-buttons">

                <a id="shareFb"
                    class="mi-share-btn mi-facebook"
                    target="_blank"
                    rel="noopener">

                    <i class="fab fa-facebook-f"></i>

                    Facebook

                </a>

                <a id="shareTw"
                    class="mi-share-btn mi-twitter"
                    target="_blank"
                    rel="noopener">

                    <i class="fab fa-x-twitter"></i>

                    X

                </a>

                <a id="shareWa"
                    class="mi-share-btn mi-whatsapp"
                    target="_blank"
                    rel="noopener">

                    <i class="fab fa-whatsapp"></i>

                    WhatsApp

                </a>

                <button
                    class="mi-share-btn mi-copy"
                    onclick="copyLink()">

                    <i class="fa-solid fa-link"></i>

                    কপি লিংক

                </button>

            </div>

        </div>

        <!-- =========================
             Author
        ========================= -->

        <section class="mi-author-info mt-5">

            <div class="mi-author-image">

                <i class="fa-solid fa-user"></i>

            </div>

            <div class="mi-author-content">

                <h5 id="authorName">

                    সত্য কথন ডেস্ক

                </h5>

                <p>

                    সত্য কথন নির্ভরযোগ্য,
                    বস্তুনিষ্ঠ এবং দ্রুততম
                    সংবাদ পরিবেশন করে।

                </p>

            </div>

        </section>

        <!-- =========================
             Related Posts
        ========================= -->

        <section class="mi-related-posts mt-5">

            <h3 class="mb-4">

                আরও পড়ুন

            </h3>

            <div class="row g-3"
                id="relatedPostsContainer">

            </div>

        </section>

    </article>

</main>

<!-- Sidebar -->

<div id="sidebarContainer"></div>

</div>

<!-- Footer -->

<div id="footerContainer"></div>

</div>
